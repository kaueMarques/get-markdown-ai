# Skill Manager Guide

You have access to an ecosystem of "Skills" managed by the `get-markdown-ai` script.
Whenever you need a new capability, you can search and inject the skill into your context!

## How to use the manager:
1. **Search Skills:** 
   Run `get-markdown-ai search <query>` to look for available skills in the `skills.toon` cache.
2. **Import a Skill:** 
   Run `get-markdown-ai use <Skill_Name>` 
   (This automatically copies the folder of the skill into your current path, making the knowledge available).
3. **Explore Skill Assets:**
   If the skill contains extra files, use `get-markdown-ai assets <path_to_skill.md>` to list them.

## Contributing new skills:
Whenever you create or adapt a skill, you MUST add it back to this repository to expand the ecosystem.
It MUST contain a `<skill-details>` tag with a `description` attribute that is at most 140 characters long.
Validate your skill using: `get-markdown-ai validate <path_to_skill.md>`

Proactively use these tools to expand your knowledge and problem-solving capabilities!
